name: quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: python -m unittest discover -s tests -p "test_*.py"
