[project]
name = "blender-animated-ui"
version = "0.1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = ["ruff==0.15.9"]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"ops_*.py" = ["N801"]
"preview_engine.py" = ["N801"]
"properties.py" = ["N801"]
"ui_*.py" = ["N801"]
