schema_version = "1.0.0"

id = "blender_animated_ui"
version = "0.2.0"
name = "Animated Thumbnail Preview Demo"
tagline = "Reusable animated media thumbnails for extension UIs"
maintainer = "Tyler Walker"
type = "add-on"

website = "https://github.com/tdw46/blender-animated-ui"
tags = ["User Interface"]

blender_version_min = "4.2.0"
blender_version_max = "5.9.999"
platforms = [
  "windows-x64",
  "macos-arm64",
  "macos-x64",
  "linux-x64",
  "linux-arm64",
]

wheels = [
  "./wheels/imageio_ffmpeg-0.6.0-py3-none-macosx_10_9_intel.macosx_10_9_x86_64.whl",
  "./wheels/imageio_ffmpeg-0.6.0-py3-none-macosx_11_0_arm64.whl",
  "./wheels/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_aarch64.whl",
  "./wheels/imageio_ffmpeg-0.6.0-py3-none-manylinux2014_x86_64.whl",
  "./wheels/imageio_ffmpeg-0.6.0-py3-none-win_amd64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-macosx_10_10_x86_64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pillow-12.3.0-cp311-cp311-win_amd64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-macosx_10_13_x86_64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-macosx_11_0_arm64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
  "./wheels/pillow-12.3.0-cp313-cp313-win_amd64.whl",
]

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Tyler Walker"]

[permissions]
network = "Repair bundled media wheels when a compatible wheel is missing"
files = "Read media and store persistent generated thumbnail caches"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.venv/",
  "/tests/",
  "/tools/",
  "/resources/blender-animated-thumbs-1.webp",
  "/resources/blender-animated-thumbs-2.webp",
  ".gitignore",
  ".gitattributes",
  ".python-version",
  "pyproject.toml",
  "uv.lock",
  "*.pyc",
  "*.pyo",
  "*.pyd",
  "*.zip",
  "*.log",
  "*.bat",
  "*.sh",
  ".DS_Store",
  "Thumbs.db",
  ".mypy_cache/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".vscode/",
  ".idea/",
  "*.egg-info/",
  "*.blend1",
  "*.blend2",
  "*.blend3",
]
